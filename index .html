<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>Island Civilization Simulator</title>
<style>
:root{
  --bg:#08100f;
  --panel:#101a18;
  --panel2:#0c1513;
  --line:#22332f;
  --text:#ecf4f1;
  --muted:#8ea19b;
  --accent:#d7ff78;
  --danger:#ff8d7d;
  --good:#8ff0c7;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{min-height:100vh}
.app{max-width:980px;margin:0 auto;padding:14px 14px 28px}
.top{
  display:flex;align-items:flex-start;justify-content:space-between;gap:12px;
  padding:14px 2px 12px
}
.brand small{display:block;color:var(--muted);font-size:11px;letter-spacing:.18em;text-transform:uppercase}
.brand h1{font-size:18px;margin:5px 0 0;letter-spacing:.02em}
.yearBox{text-align:right}
.yearBox .label{color:var(--muted);font-size:10px;letter-spacing:.16em}
.yearBox .year{font-size:30px;font-weight:800;line-height:1}
.stage{
  position:relative;border:1px solid var(--line);border-radius:18px;overflow:hidden;background:#0a1411;
  box-shadow:0 18px 55px rgba(0,0,0,.25)
}
#world{display:block;width:100%;height:auto;aspect-ratio:16/10;background:#09130f}
.overlay{
  position:absolute;left:12px;top:12px;right:12px;display:flex;justify-content:space-between;pointer-events:none
}
.badge{
  background:rgba(8,16,15,.78);backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,.08);
  border-radius:999px;padding:7px 10px;font-size:11px;color:#c7d4cf
}
.eventToast{
  position:absolute;left:50%;bottom:14px;transform:translateX(-50%) translateY(20px);
  opacity:0;background:rgba(15,26,24,.92);border:1px solid rgba(255,255,255,.1);
  padding:9px 12px;border-radius:12px;font-size:12px;max-width:88%;text-align:center;transition:.35s;
}
.eventToast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.stats{
  display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px
}
.card{
  border:1px solid var(--line);background:var(--panel);border-radius:14px;padding:11px 12px;min-width:0
}
.card .k{font-size:10px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
.card .v{font-size:19px;font-weight:750;margin-top:4px;white-space:nowrap}
.card .sub{font-size:10px;color:var(--muted);margin-top:2px}
.grid2{display:grid;grid-template-columns:1.45fr .85fr;gap:10px;margin-top:10px}
.chartPanel{border:1px solid var(--line);background:var(--panel);border-radius:16px;padding:12px}
.panelTitle{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.panelTitle b{font-size:12px}
.panelTitle span{font-size:10px;color:var(--muted)}
#chart{display:block;width:100%;height:auto;aspect-ratio:16/6;background:var(--panel2);border-radius:10px}
.logPanel{border:1px solid var(--line);background:var(--panel);border-radius:16px;padding:12px;min-height:170px}
.log{display:flex;flex-direction:column;gap:7px;max-height:205px;overflow:auto;padding-right:2px}
.logItem{font-size:11px;line-height:1.4;color:#d7e1dd;border-left:2px solid #39534b;padding-left:8px}
.logItem strong{color:var(--accent)}
.controls{
  display:flex;gap:8px;flex-wrap:wrap;margin-top:10px
}
button{
  appearance:none;border:1px solid var(--line);background:#12201d;color:var(--text);
  padding:10px 13px;border-radius:12px;font-weight:700;font-size:12px
}
button.primary{background:var(--accent);color:#13200f;border-color:transparent}
button:active{transform:translateY(1px)}
.speedWrap{
  flex:1;min-width:180px;border:1px solid var(--line);background:var(--panel);border-radius:12px;
  padding:8px 10px;display:flex;align-items:center;gap:10px
}
.speedWrap label{font-size:11px;color:var(--muted);white-space:nowrap}
input[type=range]{width:100%}
.legend{
  display:flex;gap:12px;flex-wrap:wrap;margin:11px 2px 0;color:var(--muted);font-size:10px
}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:5px;vertical-align:-1px}
.note{color:var(--muted);font-size:11px;line-height:1.55;margin:12px 2px 0}
@media(max-width:700px){
  .app{padding:10px 10px 22px}
  .stats{grid-template-columns:repeat(2,1fr)}
  .grid2{grid-template-columns:1fr}
  .brand h1{font-size:15px}
  .yearBox .year{font-size:26px}
  .card .v{font-size:18px}
}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <div class="brand">
      <small>Simulation Prototype</small>
      <h1>100人を島に置いて200年間放置したら？</h1>
    </div>
    <div class="yearBox">
      <div class="label">YEAR</div>
      <div class="year" id="year">0</div>
    </div>
  </div>

  <div class="stage">
    <canvas id="world" width="960" height="600"></canvas>
    <div class="overlay">
      <div class="badge" id="era">漂着期</div>
      <div class="badge" id="status">● RUNNING</div>
    </div>
    <div class="eventToast" id="toast"></div>
  </div>

  <div class="stats">
    <div class="card"><div class="k">Population</div><div class="v" id="pop">100</div><div class="sub">現在人口</div></div>
    <div class="card"><div class="k">Food</div><div class="v" id="food">100%</div><div class="sub">食料充足率</div></div>
    <div class="card"><div class="k">Births</div><div class="v" id="births">0</div><div class="sub">累計出生</div></div>
    <div class="card"><div class="k">Deaths</div><div class="v" id="deaths">0</div><div class="sub">累計死亡</div></div>
  </div>

  <div class="grid2">
    <div class="chartPanel">
      <div class="panelTitle"><b>Population / Food</b><span>0 → 200 years</span></div>
      <canvas id="chart" width="900" height="340"></canvas>
    </div>

    <div class="logPanel">
      <div class="panelTitle"><b>HISTORY</b><span>major events</span></div>
      <div class="log" id="log"></div>
    </div>
  </div>

  <div class="controls">
    <button class="primary" id="playBtn">▶ 再生</button>
    <button id="pauseBtn">Ⅱ 停止</button>
    <button id="resetBtn">↺ リセット</button>
    <div class="speedWrap">
      <label>速度 <strong id="speedLabel">4x</strong></label>
      <input id="speed" type="range" min="1" max="20" step="1" value="4">
    </div>
  </div>

  <div class="legend">
    <span><i class="dot" style="background:#f2efe6"></i>住民</span>
    <span><i class="dot" style="background:#d7ff78"></i>集落</span>
    <span><i class="dot" style="background:#ff8d7d"></i>危機</span>
  </div>
  <div class="note">
    YouTube用を想定した「見せるためのシミュレーター」試作。人の点・集落・人口・食料・イベント・グラフが同時に動きます。
  </div>
</div>

<script>
(() => {
  // ---------- utilities ----------
  let seed = 246813579;
  function rand(){
    seed = (seed * 1664525 + 1013904223) >>> 0;
    return seed / 4294967296;
  }
  const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
  const lerp=(a,b,t)=>a+(b-a)*t;

  // ---------- DOM ----------
  const world = document.getElementById('world');
  const ctx = world.getContext('2d');
  const chart = document.getElementById('chart');
  const cctx = chart.getContext('2d');
  const yearEl = document.getElementById('year');
  const popEl = document.getElementById('pop');
  const foodEl = document.getElementById('food');
  const birthsEl = document.getElementById('births');
  const deathsEl = document.getElementById('deaths');
  const logEl = document.getElementById('log');
  const eraEl = document.getElementById('era');
  const statusEl = document.getElementById('status');
  const toastEl = document.getElementById('toast');
  const speed = document.getElementById('speed');
  const speedLabel = document.getElementById('speedLabel');

  // ---------- state ----------
  let running = true;
  let simTimer = 0;
  let year = 0;
  let population = 100;
  let food = 1.0;
  let births = 0;
  let deaths = 0;
  let tech = 0;
  let villages = [];
  let people = [];
  let history = [];
  let chartData = [];
  let activeCrisis = null;
  let crisisYears = 0;
  let lastTs = performance.now();
  let toastTimer = 0;

  const island = {cx: 480, cy: 318, rx: 355, ry: 220};

  function insideIsland(x,y){
    const dx=(x-island.cx)/island.rx, dy=(y-island.cy)/island.ry;
    const wobble = 0.95 + 0.06*Math.sin(Math.atan2(dy,dx)*5) + 0.04*Math.cos(Math.atan2(dy,dx)*8);
    return dx*dx + dy*dy < wobble*wobble;
  }
  function randomIslandPoint(){
    for(let i=0;i<1000;i++){
      const x=130+rand()*700, y=120+rand()*390;
      if(insideIsland(x,y)) return {x,y};
    }
    return {x:island.cx,y:island.cy};
  }

  class Person{
    constructor(){
      const p=randomIslandPoint();
      this.x=p.x; this.y=p.y;
      this.tx=p.x; this.ty=p.y;
      this.spd=.15+rand()*.4;
      this.phase=rand()*Math.PI*2;
    }
    update(dt){
      if(Math.hypot(this.tx-this.x,this.ty-this.y)<7 || rand()<0.002){
        let p;
        if(villages.length && rand()<0.68){
          const v=villages[Math.floor(rand()*villages.length)];
          p={x:v.x+(rand()-.5)*80,y:v.y+(rand()-.5)*60};
          if(!insideIsland(p.x,p.y)) p=randomIslandPoint();
        } else p=randomIslandPoint();
        this.tx=p.x; this.ty=p.y;
      }
      const dx=this.tx-this.x,dy=this.ty-this.y,d=Math.hypot(dx,dy)||1;
      this.x+=dx/d*this.spd*dt;
      this.y+=dy/d*this.spd*dt;
      this.phase+=dt*.003;
    }
  }

  function syncPeople(){
    const target = Math.min(380, Math.max(35, Math.round(population/3.3)));
    while(people.length<target) people.push(new Person());
    if(people.length>target) people.length=target;
  }

  function addEvent(text, important=false){
    history.unshift({year,text,important});
    history = history.slice(0,12);
    renderLog();
    if(important){
      toastEl.textContent = `YEAR ${year} — ${text}`;
      toastEl.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(()=>toastEl.classList.remove('show'), 2600);
    }
  }

  function renderLog(){
    logEl.innerHTML = history.map(e =>
      `<div class="logItem">${e.important?'<strong>YEAR '+e.year+'</strong>':'YEAR '+e.year} — ${e.text}</div>`
    ).join('');
  }

  function setEra(){
    let t='漂着期';
    if(year>=25) t='定住期';
    if(year>=60) t='村落期';
    if(year>=120) t='拡張期';
    if(year>=170) t='初期文明';
    eraEl.textContent=t;
  }

  function maybeVillage(){
    const needed = [150, 260, 430, 650, 900];
    if(villages.length < needed.length && population >= needed[villages.length]){
      const p=randomIslandPoint();
      villages.push({x:p.x,y:p.y,r:10+villages.length*2,name:'Settlement '+(villages.length+1)});
      addEvent(`${villages[villages.length-1].name} が形成された`, true);
    }
  }

  function triggerCrisis(type, yrs){
    activeCrisis=type; crisisYears=yrs;
    if(type==='famine') addEvent('大規模な食料危機が発生', true);
    if(type==='disease') addEvent('感染症が島内で流行', true);
    if(type==='conflict') addEvent('集落間の武力衝突が発生', true);
  }

  function stepYear(){
    year++;
    tech += 0.018 + population/90000;

    // baseline food production: starts fragile, improves with tech and settlements
    const carrying = 150 + villages.length*180 + tech*210;
    const pressure = population / Math.max(1,carrying);
    let production = 1.12 - Math.max(0, pressure-0.7)*0.42 + tech*0.012;
    production += (rand()-.5)*0.08;
    food = clamp(food*0.65 + production*0.35, 0.22, 1.25);

    if(!activeCrisis && year>18){
      const r=rand();
      if(r<0.014) triggerCrisis('famine', 4+Math.floor(rand()*5));
      else if(r<0.025) triggerCrisis('disease', 3+Math.floor(rand()*4));
      else if(r<0.033 && villages.length>=2) triggerCrisis('conflict', 2+Math.floor(rand()*4));
    }

    let crisisDeath = 0;
    let crisisBirthPenalty = 0;
    if(activeCrisis){
      crisisYears--;
      if(activeCrisis==='famine'){ food*=0.83; crisisDeath=.018; crisisBirthPenalty=.025; }
      if(activeCrisis==='disease'){ crisisDeath=.030; crisisBirthPenalty=.010; }
      if(activeCrisis==='conflict'){ crisisDeath=.014; crisisBirthPenalty=.016; }
      if(crisisYears<=0){
        addEvent(
          activeCrisis==='famine'?'食料危機が終息':
          activeCrisis==='disease'?'感染症が終息':'武力衝突が終結'
        , false);
        activeCrisis=null;
      }
    }

    const birthRate = clamp(0.034 + (food-.72)*0.028 - crisisBirthPenalty, 0.004, 0.050);
    const deathRate = clamp(0.020 + Math.max(0,.72-food)*0.070 + crisisDeath, 0.010, 0.11);

    const b = Math.max(0, Math.round(population * birthRate * (0.8+rand()*.4)));
    const d = Math.max(0, Math.round(population * deathRate * (0.85+rand()*.3)));
    births += b; deaths += d;
    population = Math.max(12, population + b - d);

    // soft ceiling to keep prototype readable
    if(population>1300){
      const extra=Math.round((population-1300)*0.12);
      population-=extra; deaths+=extra;
    }

    if(year===20) addEvent('中央部に恒常的な農耕地が生まれた', true);
    if(year===50) addEvent('島内の交易路が定着し始めた', true);
    if(year===100) addEvent('100年間の生存に成功', true);
    if(year===150) addEvent('複数集落を結ぶ共同評議会が成立', true);
    if(year===200) addEvent('200 YEAR REPORT：シミュレーション終了', true);

    maybeVillage();
    syncPeople();
    chartData.push({year,pop:population,food:Math.round(food*100)});
    if(chartData.length>201) chartData.shift();
    setEra();
    updateStats();

    if(year>=200){
      running=false;
      statusEl.textContent='■ COMPLETE';
    }
  }

  function updateStats(){
    yearEl.textContent=year;
    popEl.textContent=population.toLocaleString();
    foodEl.textContent=Math.round(food*100)+'%';
    birthsEl.textContent=births.toLocaleString();
    deathsEl.textContent=deaths.toLocaleString();
  }

  function drawIsland(){
    ctx.clearRect(0,0,world.width,world.height);

    // ocean gradient
    const g=ctx.createLinearGradient(0,0,0,600);
    g.addColorStop(0,'#071310');
    g.addColorStop(1,'#0b1a16');
    ctx.fillStyle=g; ctx.fillRect(0,0,960,600);

    // subtle grid
    ctx.strokeStyle='rgba(255,255,255,.025)';ctx.lineWidth=1;
    for(let x=0;x<960;x+=48){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,600);ctx.stroke();}
    for(let y=0;y<600;y+=48){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(960,y);ctx.stroke();}

    // island with hand-drawn-ish outline
    ctx.beginPath();
    const pts=120;
    for(let i=0;i<=pts;i++){
      const a=i/pts*Math.PI*2;
      const rr=1 + .06*Math.sin(a*5) + .035*Math.cos(a*9);
      const x=island.cx+Math.cos(a)*island.rx*rr;
      const y=island.cy+Math.sin(a)*island.ry*rr;
      if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y);
    }
    ctx.closePath();
    const ig=ctx.createRadialGradient(450,300,20,480,320,390);
    ig.addColorStop(0,'#1f4a34');
    ig.addColorStop(.62,'#173b2b');
    ig.addColorStop(1,'#123124');
    ctx.fillStyle=ig;ctx.fill();
    ctx.strokeStyle='rgba(179,230,188,.18)';ctx.lineWidth=3;ctx.stroke();

    // forest texture
    ctx.fillStyle='rgba(85,135,95,.28)';
    for(let i=0;i<95;i++){
      const a=(i*83.7)%360*Math.PI/180, r=((i*47)%100)/100;
      const x=island.cx+Math.cos(a)*island.rx*r*.88;
      const y=island.cy+Math.sin(a)*island.ry*r*.85;
      if(insideIsland(x,y)){
        ctx.beginPath();ctx.arc(x,y,2+(i%3),0,Math.PI*2);ctx.fill();
      }
    }

    // coast highlight
    ctx.strokeStyle='rgba(215,255,120,.055)';ctx.lineWidth=12;ctx.stroke();

    // people
    people.forEach((p,i)=>{
      const crisis = activeCrisis && (i%9===0);
      ctx.fillStyle = crisis ? '#ff8d7d' : 'rgba(242,239,230,.84)';
      ctx.beginPath();ctx.arc(p.x,p.y,2.2,0,Math.PI*2);ctx.fill();
    });

    // villages
    villages.forEach((v,i)=>{
      ctx.fillStyle='rgba(215,255,120,.16)';
      ctx.beginPath();ctx.arc(v.x,v.y,18+i*2,0,Math.PI*2);ctx.fill();

      ctx.fillStyle='#d7ff78';
      for(let j=0;j<4+Math.min(4,i);j++){
        const a=j/(4+Math.min(4,i))*Math.PI*2;
        ctx.fillRect(v.x+Math.cos(a)*10-2.5,v.y+Math.sin(a)*8-2,5,4);
      }
      ctx.font='10px system-ui';ctx.fillStyle='rgba(236,244,241,.72)';
      ctx.fillText(v.name,v.x-28,v.y+31+i*2);
    });

    // conflict lines
    if(activeCrisis==='conflict' && villages.length>=2){
      ctx.save();
      ctx.strokeStyle='rgba(255,141,125,.7)';ctx.lineWidth=2;ctx.setLineDash([6,6]);
      const a=villages[0],b=villages[1];
      ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();
      ctx.restore();
    }

    // title marks
    ctx.font='700 12px system-ui';ctx.fillStyle='rgba(236,244,241,.72)';
    ctx.fillText('ISLAND A-01',44,555);
    ctx.font='10px system-ui';ctx.fillStyle='rgba(142,161,155,.75)';
    ctx.fillText('autonomous population / food / settlement simulation',44,573);
  }

  function drawChart(){
    cctx.clearRect(0,0,chart.width,chart.height);
    cctx.fillStyle='#0c1513';cctx.fillRect(0,0,chart.width,chart.height);
    const pad={l:48,r:26,t:24,b:34};
    const w=chart.width-pad.l-pad.r,h=chart.height-pad.t-pad.b;

    // grid
    cctx.strokeStyle='rgba(255,255,255,.055)';cctx.lineWidth=1;
    cctx.font='18px system-ui';cctx.fillStyle='rgba(142,161,155,.8)';
    for(let i=0;i<=4;i++){
      const y=pad.t+h*i/4;
      cctx.beginPath();cctx.moveTo(pad.l,y);cctx.lineTo(chart.width-pad.r,y);cctx.stroke();
    }
    for(let i=0;i<=4;i++){
      const x=pad.l+w*i/4;
      cctx.beginPath();cctx.moveTo(x,pad.t);cctx.lineTo(x,pad.t+h);cctx.stroke();
      cctx.fillText(Math.round(200*i/4),x-8,chart.height-10);
    }

    if(chartData.length<2) return;
    const maxPop=Math.max(150,...chartData.map(d=>d.pop))*1.08;

    // population
    cctx.beginPath();
    chartData.forEach((d,i)=>{
      const x=pad.l + d.year/200*w;
      const y=pad.t+h - d.pop/maxPop*h;
      if(i===0)cctx.moveTo(x,y);else cctx.lineTo(x,y);
    });
    cctx.strokeStyle='#d7ff78';cctx.lineWidth=4;cctx.stroke();

    // food %
    cctx.beginPath();
    chartData.forEach((d,i)=>{
      const x=pad.l + d.year/200*w;
      const y=pad.t+h - clamp(d.food,0,125)/125*h;
      if(i===0)cctx.moveTo(x,y);else cctx.lineTo(x,y);
    });
    cctx.strokeStyle='#71b7ff';cctx.lineWidth=3;cctx.stroke();

    cctx.font='18px system-ui';
    cctx.fillStyle='#d7ff78';cctx.fillText('POP',pad.l+8,pad.t+18);
    cctx.fillStyle='#71b7ff';cctx.fillText('FOOD',pad.l+78,pad.t+18);
  }

  function reset(){
    seed=246813579;
    year=0;population=100;food=1;births=0;deaths=0;tech=0;
    villages=[];people=[];history=[];chartData=[];activeCrisis=null;crisisYears=0;
    running=true;simTimer=0;
    for(let i=0;i<35;i++)people.push(new Person());
    chartData.push({year:0,pop:100,food:100});
    addEvent('100人が島へ上陸した', true);
    updateStats();setEra();
    statusEl.textContent='● RUNNING';
  }

  // ---------- loop ----------
  function loop(ts){
    const dt=Math.min(40,ts-lastTs); lastTs=ts;
    const sp=+speed.value;
    if(running){
      people.forEach(p=>p.update(dt*sp*.28));
      simTimer += dt*sp;
      while(simTimer>850 && running){
        simTimer-=850;
        stepYear();
      }
    }
    drawIsland();
    drawChart();
    requestAnimationFrame(loop);
  }

  // ---------- controls ----------
  document.getElementById('playBtn').onclick=()=>{ if(year>=200) reset(); running=true;statusEl.textContent='● RUNNING'; };
  document.getElementById('pauseBtn').onclick=()=>{ running=false;statusEl.textContent='Ⅱ PAUSED'; };
  document.getElementById('resetBtn').onclick=()=>reset();
  speed.oninput=()=>speedLabel.textContent=speed.value+'x';

  reset();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
