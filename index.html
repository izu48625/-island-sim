<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#07101f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Stats Maker V2 — Single Preview</title>
  <style>
:root{
  --bg:#07101f;
  --panel:#0d1829;
  --panel2:#111f34;
  --line:#263a56;
  --text:#eef4ff;
  --muted:#8ea2bf;
  --accent:#5687ff;
  --accent2:#6f9cff;
  --ok:#65d79d;
  --danger:#ff8181;
  --radius:14px;
  --shadow:0 16px 45px rgba(0,0,0,.25);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",Arial,sans-serif}
body{min-height:100vh}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
a{color:inherit;text-decoration:none}
.hidden{display:none!important}

.app-header,.editor-header{
  min-height:58px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  border-bottom:1px solid var(--line);
  padding:8px 14px;
  background:rgba(7,16,31,.96);
  position:sticky;
  top:0;
  z-index:40;
  backdrop-filter:blur(10px);
}
.brand-wrap{display:flex;align-items:center;gap:10px}
.brand-mark{
  width:32px;height:32px;border-radius:9px;background:linear-gradient(145deg,#22497e,#182c50);
  display:grid;place-items:center;font-weight:950
}
.brand{font-size:12px;font-weight:950;letter-spacing:.12em}
.brand-sub{font-size:9px;color:var(--muted);margin-top:2px}
.header-actions{display:flex;gap:8px}

.btn{
  min-height:36px;
  padding:0 12px;
  border-radius:9px;
  border:1px solid var(--line);
  color:var(--text);
  background:#14233a;
  font-weight:800;
  font-size:11px;
}
.btn:hover{filter:brightness(1.08)}
.btn.primary{background:#2857a7;border-color:#4478c9}
.btn.ghost{background:#0a1525}
.btn.compact{min-height:32px;padding:0 10px}

.home-shell{width:min(1180px,calc(100% - 28px));margin:0 auto;padding:26px 0 60px}
.hero{
  min-height:220px;
  display:flex;
  align-items:flex-end;
  border:1px solid var(--line);
  border-radius:22px;
  padding:28px;
  background:
    radial-gradient(circle at 82% 15%,rgba(76,125,255,.28),transparent 36%),
    linear-gradient(145deg,#101f35,#081322);
  box-shadow:var(--shadow);
}
.eyebrow{font-size:10px;font-weight:950;letter-spacing:.14em;color:#6fd5a5}
.hero h1{margin:7px 0 8px;font-size:clamp(30px,5vw,58px);line-height:1.03;max-width:840px}
.hero p{margin:0;max-width:720px;color:#a3b3c8;line-height:1.65;font-size:13px}
.section-block{margin-top:34px}
.section-head{display:flex;align-items:end;justify-content:space-between;margin-bottom:14px}
.section-head h2{margin:4px 0 0;font-size:20px}

.template-grid{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:14px;
}
.template-card{
  border:1px solid var(--line);
  border-radius:16px;
  overflow:hidden;
  background:var(--panel);
  transition:.18s ease;
}
.template-card:hover{transform:translateY(-2px);border-color:#45658f}
.template-preview{
  aspect-ratio:16/10;
  background:#0a1525;
  border-bottom:1px solid var(--line);
  padding:16px;
  display:flex;
  align-items:center;
  justify-content:center;
}
.template-copy{padding:14px}
.template-title{font-weight:950;font-size:14px}
.template-desc{font-size:10px;color:var(--muted);line-height:1.55;margin-top:5px}
.template-actions{margin-top:11px;display:flex;justify-content:flex-end}

.project-grid{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:12px;
}
.project-card{
  border:1px solid var(--line);
  border-radius:14px;
  background:var(--panel);
  padding:14px;
}
.project-card-head{display:flex;gap:10px;justify-content:space-between}
.project-type{font-size:9px;color:#6f92c9;text-transform:uppercase;font-weight:950;letter-spacing:.1em}
.project-title{font-size:14px;font-weight:900;margin-top:4px;word-break:break-word}
.project-meta{font-size:9px;color:var(--muted);margin-top:8px}
.project-actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.empty-state{
  padding:36px 18px;
  border:1px dashed #2b415f;
  border-radius:14px;
  text-align:center;
  color:var(--muted);
  font-size:11px;
}
.empty-icon{font-size:24px;margin-bottom:7px}

.mini-ranking{
  width:100%;
  display:grid;
  gap:7px;
}
.mini-rank-row{
  display:grid;grid-template-columns:24px 1fr auto;
  gap:7px;align-items:center;
  padding:6px 8px;border-radius:7px;background:#12213a;font-size:9px
}
.mini-rank-row b{font-size:12px}

.mini-stat{
  width:62%;aspect-ratio:3/4;border-radius:14px;background:linear-gradient(160deg,#1c3d71,#0d1830);
  padding:12px;display:flex;flex-direction:column;justify-content:space-between;border:1px solid #3d5f90
}
.mini-stat .ovr{font-size:30px;font-weight:1000}
.mini-stat .name{font-size:11px;font-weight:900}
.mini-stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:4px;font-size:8px;color:#c9d6e7}

.mini-quadrant{
  width:80%;aspect-ratio:1;border:1px solid #355174;border-radius:10px;position:relative;
  background:linear-gradient(90deg,transparent 49.5%,#315071 50%,transparent 50.5%),linear-gradient(transparent 49.5%,#315071 50%,transparent 50.5%);
}
.mini-dot{position:absolute;width:10px;height:10px;border-radius:50%;background:#77a1ff;box-shadow:0 0 0 3px rgba(119,161,255,.15)}
.mini-dot.d1{left:67%;top:20%}.mini-dot.d2{left:30%;top:32%}.mini-dot.d3{left:74%;top:67%}.mini-dot.d4{left:22%;top:72%}

@media(max-width:850px){
  .template-grid,.project-grid{grid-template-columns:1fr 1fr}
}
@media(max-width:560px){
  .home-shell{width:min(100% - 18px,1180px);padding-top:14px}
  .hero{min-height:195px;padding:20px;border-radius:16px}
  .hero h1{font-size:34px}
  .template-grid,.project-grid{grid-template-columns:1fr}
  .brand-sub{display:none}
}


.mini-bar{
  width:86%;
  display:grid;
  gap:8px;
}
.mini-bar div{
  display:grid;
  grid-template-columns:18px 1fr;
  gap:7px;
  align-items:center;
  font-size:8px;
  color:#91a4bf;
}
.mini-bar i{
  height:8px;
  border-radius:999px;
  background:linear-gradient(90deg,#4f86ef,#79a4ff);
}

.mini-radar{
  width:70%;
  aspect-ratio:1;
}
.mini-radar svg{
  width:100%;
  height:100%;
}
.mini-radar .grid{
  fill:none;
  stroke:#344a67;
  stroke-width:2;
}
.mini-radar .shape{
  stroke-width:2.4;
}
.mini-radar .shape.a{
  fill:rgba(111,156,255,.22);
  stroke:#6f9cff;
}
.mini-radar .shape.b{
  fill:rgba(53,208,127,.16);
  stroke:#35d07f;
}


/* R7 Create categories */
.template-grid{display:block}
.create-category{margin-bottom:26px}
.create-category-title{font-size:10px;font-weight:950;letter-spacing:.13em;color:#7890b1;margin:0 0 9px}
.category-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.mini-generic{position:relative;width:84%;height:55%;border-bottom:2px solid #3d5575}
.mini-dot-preview i{position:absolute;bottom:-6px;width:11px;height:11px;border-radius:50%;background:#6f9cff}
.mini-ring-preview{display:flex;gap:9px}.mini-ring-preview i{width:46px;height:46px;border-radius:50%;border:7px solid #243853;border-top-color:#6f9cff;border-right-color:#6f9cff}
.mini-tier-preview{width:90%;display:grid;grid-template-columns:30px 1fr;gap:4px}.mini-tier-preview b{display:grid;place-items:center;background:#284b7d;border-radius:4px;font-size:9px}.mini-tier-preview span{background:#14233a;border-radius:4px}
.mini-heatmap-preview{width:80%;display:grid;grid-template-columns:repeat(5,1fr);gap:3px}.mini-heatmap-preview i{aspect-ratio:1;background:#6f9cff;border-radius:2px}
.mini-scatter-preview{width:80%;height:70%;position:relative;border-left:1px solid #3a5271;border-bottom:1px solid #3a5271}.mini-scatter-preview i{position:absolute;width:8px;height:8px;border-radius:50%;background:#6f9cff}.mini-scatter-preview .s1{left:20%;bottom:28%}.mini-scatter-preview .s2{left:45%;bottom:60%}.mini-scatter-preview .s3{left:67%;bottom:42%}.mini-scatter-preview .s4{left:80%;bottom:78%}
.mini-range-preview{width:86%;display:grid;gap:10px}.mini-range-preview span{height:3px;background:#40536f;position:relative}.mini-range-preview i,.mini-range-preview b{position:absolute;top:50%;width:9px;height:9px;border-radius:50%;transform:translate(-50%,-50%)}.mini-range-preview i{left:20%;background:#7e91ab}.mini-range-preview b{left:78%;background:#6f9cff}
.mini-waffle-preview{width:72%;display:grid;grid-template-columns:repeat(10,1fr);gap:2px}.mini-waffle-preview i{aspect-ratio:1;background:#1b2b43;border-radius:1px}.mini-waffle-preview i.on{background:#6f9cff}
@media(max-width:980px){.category-grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:760px){.category-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:520px){.category-grid{grid-template-columns:1fr}}

.mini-statboard-preview{width:78%;display:grid;grid-template-columns:1fr 1fr;gap:5px}.mini-statboard-preview b{grid-column:span 2;font-size:25px}.mini-statboard-preview span,.mini-statboard-preview i{height:28px;background:#142843;border:1px solid #28415f;border-radius:5px}.mini-statboard-preview i{height:10px;background:#5f8be8}


.editor-body{overflow:hidden}
.editor-header{position:relative;z-index:30}
.editor-header-left,.editor-header-actions{display:flex;align-items:center;gap:7px}
.project-title-input{
  width:min(280px,34vw);
  border:1px solid transparent;
  background:transparent;
  color:var(--text);
  font-weight:900;
  font-size:13px;
  padding:7px 8px;
  border-radius:8px;
}
.project-title-input:focus{outline:none;border-color:#31527d;background:#0b1728}
.save-state-wrap{position:absolute;left:50%;transform:translateX(-50%)}
.save-state{font-size:9px;color:#7186a5}
.save-state.saving{color:#efc86d}.save-state.error{color:var(--danger)}

.editor-layout{
  height:calc(100vh - 58px);
  display:grid;
  grid-template-columns:350px minmax(0,1fr);
}
.editor-sidebar{
  border-right:1px solid var(--line);
  background:#091423;
  min-height:0;
  display:flex;
  flex-direction:column;
}
.panel-tabs{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  border-bottom:1px solid var(--line);
}
.panel-tab{
  min-height:46px;
  background:transparent;
  border:0;
  border-bottom:2px solid transparent;
  color:#7388a6;
  font-size:9px;
  font-weight:950;
}
.panel-tab.active{color:#d9e6fb;border-bottom-color:#5c8fff;background:#0d1a2c}
.panel-content{overflow:auto;padding:13px;min-height:0}

.preview-area{
  min-width:0;
  display:flex;
  flex-direction:column;
  background:
    linear-gradient(45deg,#0a1422 25%,transparent 25%),
    linear-gradient(-45deg,#0a1422 25%,transparent 25%),
    linear-gradient(45deg,transparent 75%,#0a1422 75%),
    linear-gradient(-45deg,transparent 75%,#0a1422 75%);
  background-size:22px 22px;
  background-position:0 0,0 11px,11px -11px,-11px 0;
}
.preview-toolbar{
  min-height:44px;display:flex;align-items:center;justify-content:space-between;
  padding:6px 12px;border-bottom:1px solid var(--line);background:#081320
}
.type-badge{font-size:9px;font-weight:950;color:#7da6e3;text-transform:uppercase;letter-spacing:.1em}
.zoom-controls{display:flex;align-items:center;gap:5px}
.zoom-label{font-size:9px;color:#8ea2bf;width:42px;text-align:center}

.canvas-stage{
  flex:1;min-height:0;overflow:auto;padding:28px;display:grid;place-items:center
}
.canvas-shell{
  transform-origin:center center;
  box-shadow:0 22px 60px rgba(0,0,0,.4);
}
.preview-root{
  width:100%;height:100%;
  overflow:hidden;
  position:relative;
  background:#10192b;
}

.panel-section{margin-bottom:18px}
.panel-section-title{
  font-size:9px;font-weight:950;color:#7189aa;letter-spacing:.12em;margin-bottom:8px;text-transform:uppercase
}
.field{display:grid;gap:5px;margin-bottom:10px}
.field label{font-size:9px;color:#9aabc2;font-weight:800}
.input,.select,.textarea{
  width:100%;border:1px solid #293f5d;background:#0d1929;color:#eef4ff;
  border-radius:8px;min-height:35px;padding:7px 9px;font-size:11px
}
.textarea{min-height:74px;resize:vertical}
.inline-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.color-row{display:grid;grid-template-columns:42px 1fr;gap:8px;align-items:center}
.color-input{width:42px;height:36px;border:1px solid #2c4462;border-radius:8px;background:#0d1929;padding:3px}

.data-list{display:grid;gap:8px}
.data-row{
  border:1px solid #253b58;background:#0d192a;border-radius:10px;padding:9px;
  display:grid;gap:7px
}
.data-row-head{display:flex;justify-content:space-between;align-items:center;gap:7px}
.drag-label{font-size:9px;color:#687f9f}
.row-actions{display:flex;gap:5px}
.icon-btn{
  width:28px;height:28px;border-radius:7px;border:1px solid #2b4260;background:#102039;color:#a8bad2
}
.row-grid{display:grid;grid-template-columns:1.6fr .7fr;gap:7px}
.add-row-btn{width:100%;margin-top:8px}

.theme-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:7px}
.theme-btn{
  min-height:58px;border:1px solid #29415f;border-radius:9px;padding:8px;text-align:left;color:#fff
}
.theme-btn.active{outline:2px solid #6d99ff}
.theme-swatches{display:flex;gap:4px;margin-top:6px}
.swatch{width:15px;height:15px;border-radius:4px;border:1px solid rgba(255,255,255,.16)}

.segmented{display:grid;grid-template-columns:repeat(2,1fr);gap:6px}
.seg-btn{
  min-height:34px;border:1px solid #2a405e;background:#0e1a2c;color:#96a8c0;border-radius:8px;font-size:10px;font-weight:800
}
.seg-btn.active{background:#23497e;border-color:#4779bd;color:#fff}

.mobile-bottom-tabs,.sheet-backdrop{display:none}

/* Shared visualization canvas */
.visual{
  width:100%;height:100%;
  color:var(--visual-text,#fff);
  background:var(--visual-bg,#121b2d);
  padding:6%;
  position:relative;
}
.visual .viz-subtitle{color:var(--visual-muted,#a8b3c7)}
.viz-title{font-weight:1000;letter-spacing:-.03em}

/* Ranking */
.ranking-visual{display:flex;flex-direction:column}
.ranking-head{margin-bottom:4%}
.ranking-title{font-size:7.2cqw;line-height:1}
.ranking-subtitle{font-size:2.4cqw;margin-top:1.2%}
.ranking-list{display:grid;gap:1.2%;flex:1;min-height:0}
.ranking-row{
  display:grid;grid-template-columns:10% 1fr auto;
  gap:2.5%;align-items:center;
  padding:1.7% 2.2%;
  border-radius:2.4cqw;
  background:var(--visual-surface,rgba(255,255,255,.06));
  border:1px solid var(--visual-border,rgba(255,255,255,.09));
}
.ranking-rank{font-size:5cqw;font-weight:1000;color:var(--visual-accent,#6d96ff)}
.ranking-name{font-size:3.6cqw;font-weight:900;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ranking-note{font-size:1.9cqw;color:var(--visual-muted,#a8b3c7);margin-top:.3cqw}
.ranking-value{font-size:4.2cqw;font-weight:1000;text-align:right}
.ranking-unit{font-size:1.8cqw;color:var(--visual-muted,#a8b3c7);margin-left:.4cqw}

/* Stat Card */
.stat-card-visual{
  display:flex;align-items:center;justify-content:center;
  background:var(--visual-bg,#10182a)
}
.player-card{
  width:78%;height:88%;border-radius:5cqw;
  background:linear-gradient(155deg,var(--visual-surface,#1c396a),var(--visual-bg,#0d172b));
  border:1px solid var(--visual-border,rgba(255,255,255,.18));
  padding:6%;
  display:flex;flex-direction:column;
  box-shadow:0 2cqw 7cqw rgba(0,0,0,.25)
}
.stat-top{display:flex;justify-content:space-between;align-items:flex-start}
.stat-name{font-size:5.7cqw;font-weight:1000;line-height:1}
.stat-subtitle{font-size:2.1cqw;color:var(--visual-muted,#a8b3c7);margin-top:1.1cqw}
.ovr-box{text-align:center}
.ovr-label{font-size:1.8cqw;color:var(--visual-muted,#a8b3c7);font-weight:900}
.ovr-value{font-size:10cqw;line-height:.95;font-weight:1000;color:var(--visual-accent,#7aa2ff)}
.stat-divider{height:1px;background:var(--visual-border,rgba(255,255,255,.15));margin:5% 0}
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:4%;margin-top:auto}
.stat-cell{display:flex;justify-content:space-between;align-items:end;border-bottom:1px solid var(--visual-border,rgba(255,255,255,.12));padding-bottom:1.6%}
.stat-label{font-size:2.6cqw;font-weight:950;color:var(--visual-muted,#a8b3c7)}
.stat-value{font-size:5cqw;font-weight:1000}
.stat-footer{margin-top:auto;font-size:2cqw;color:var(--visual-muted,#a8b3c7);display:flex;justify-content:space-between}

/* Quadrant */
.quadrant-visual{display:flex;flex-direction:column}
.quad-head{margin-bottom:3%}
.quad-title{font-size:6.4cqw}
.quad-subtitle{font-size:2.1cqw;margin-top:.9%}
.quad-chart{
  flex:1;min-height:0;position:relative;margin:4% 6% 8%;
  border-left:.4cqw solid var(--visual-muted,#8091a9);
  border-bottom:.4cqw solid var(--visual-muted,#8091a9);
}
.quad-vline,.quad-hline{position:absolute;background:var(--visual-border,rgba(255,255,255,.22))}
.quad-vline{top:0;bottom:0;width:.2cqw}
.quad-hline{left:0;right:0;height:.2cqw}
.quad-label{
  position:absolute;font-size:1.8cqw;color:var(--visual-muted,#a8b3c7);
  font-weight:850;opacity:.82
}
.quad-label.tl{left:2%;top:2%}.quad-label.tr{right:2%;top:2%}
.quad-label.bl{left:2%;bottom:2%}.quad-label.br{right:2%;bottom:2%}
.axis-x{position:absolute;right:0;bottom:-5%;font-size:1.8cqw;color:var(--visual-muted,#a8b3c7)}
.axis-y{position:absolute;left:-1%;top:-4%;font-size:1.8cqw;color:var(--visual-muted,#a8b3c7)}
.quad-point{position:absolute;transform:translate(-50%,50%);display:flex;align-items:center;gap:.6cqw}
.quad-point-dot{width:2.3cqw;height:2.3cqw;border-radius:50%;background:var(--visual-accent,#70a0ff);box-shadow:0 0 0 .7cqw rgba(109,153,255,.16)}
.quad-point-name{font-size:1.8cqw;font-weight:900;white-space:nowrap;text-shadow:0 1px 2px rgba(0,0,0,.65)}

@media(max-width:760px){
  .editor-body{overflow:auto;padding-bottom:56px}
  .editor-header{min-height:54px}
  .editor-header-actions .btn:not(#exportBtn):not(#langBtn){display:none}
  .save-state-wrap{display:none}
  .project-title-input{width:38vw}
  .editor-layout{height:auto;display:block}
  .editor-sidebar{display:none}
  .preview-area{min-height:calc(100vh - 110px)}
  .preview-toolbar{min-height:38px}
  .canvas-stage{padding:18px 10px 90px;min-height:calc(100vh - 150px)}
  .mobile-bottom-tabs{
    display:grid;grid-template-columns:repeat(4,1fr);
    position:fixed;left:0;right:0;bottom:0;height:56px;z-index:60;
    background:#081321;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)
  }
  .mobile-tab{border:0;background:transparent;color:#7086a5;font-size:9px;font-weight:950}
  .mobile-tab.active{color:#fff;background:#10213a}
  .sheet-backdrop{
    position:fixed;inset:0;z-index:55;background:rgba(0,0,0,.36);align-items:flex-end
  }
  .sheet-backdrop:not(.hidden){display:flex}
  .mobile-sheet{
    width:100%;max-height:70vh;overflow:auto;background:#0a1524;border:1px solid #2a405c;
    border-radius:18px 18px 0 0;padding:8px 12px calc(76px + env(safe-area-inset-bottom))
  }
  .sheet-handle{width:42px;height:4px;background:#36506f;border-radius:999px;margin:2px auto 10px}
}


/* ===== V2 B1 R2 Ranking Card polish ===== */
.visual{
  font-family:var(--visual-font,system-ui);
}
.template-picker{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:7px;
}
.template-choice{
  min-height:70px;
  border:1px solid #2a405e;
  border-radius:10px;
  padding:9px;
  text-align:left;
  background:#0d1929;
  color:#dce8f8;
}
.template-choice.active{
  outline:2px solid #6d99ff;
  border-color:#6d99ff;
}
.template-choice-name{font-size:10px;font-weight:950;text-transform:uppercase}
.template-choice-preview{
  margin-top:8px;height:22px;border-radius:5px;border:1px solid rgba(255,255,255,.1)
}
.option-list{display:grid;gap:7px}
.option-toggle{
  min-height:38px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  border:1px solid #263d59;
  border-radius:9px;
  padding:8px 10px;
  background:#0d192a;
  color:#aebed2;
  font-size:10px;
  font-weight:800;
}
.option-toggle i{
  width:34px;height:19px;border-radius:999px;background:#24364d;position:relative;flex:none
}
.option-toggle i::after{
  content:"";position:absolute;width:13px;height:13px;border-radius:50%;
  background:#8393a8;top:3px;left:3px;transition:.15s
}
.option-toggle.on{color:#edf5ff;border-color:#355982}
.option-toggle.on i{background:#285a9e}
.option-toggle.on i::after{left:18px;background:#fff}
.topn-presets{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.topn-btn{
  min-height:33px;border:1px solid #29405d;border-radius:8px;
  background:#0e1a2c;color:#91a6c1;font-size:10px;font-weight:900
}
.topn-btn.active{background:#28549a;border-color:#4a7ac2;color:#fff}

/* Ranking structure */
.ranking-visual{
  display:flex;
  flex-direction:column;
  padding:5.5%;
  isolation:isolate;
}
.ranking-kicker{
  font-size:1.65cqw;
  font-weight:950;
  letter-spacing:.22em;
  color:var(--visual-accent,#6f9cff);
  margin-bottom:1.6%;
}
.ranking-head{
  display:flex;
  justify-content:space-between;
  align-items:flex-end;
  gap:3%;
  margin-bottom:2.2%;
}
.ranking-title{
  font-size:calc(6.6cqw * var(--title-scale,1));
  line-height:.98;
}
.ranking-subtitle{
  font-size:calc(2.05cqw * var(--body-scale,1));
  margin-top:1.1%;
  letter-spacing:.08em;
  text-transform:uppercase;
}
.ranking-count-badge{
  flex:none;
  border:1px solid var(--visual-border,rgba(255,255,255,.15));
  border-radius:999px;
  padding:.75cqw 1.2cqw;
  font-size:1.65cqw;
  font-weight:950;
  color:var(--visual-muted,#9eadc1);
}
.ranking-rule{
  height:.23cqw;
  background:linear-gradient(90deg,var(--visual-accent,#6f9cff),transparent);
  margin-bottom:2.2%;
  opacity:.9;
}
.ranking-list{
  display:grid;
  gap:1.05%;
  flex:1;
  min-height:0;
}
.ranking-row{
  position:relative;
  overflow:hidden;
  display:grid;
  grid-template-columns:7.5% 8.5% minmax(0,1fr) auto;
  gap:1.6%;
  align-items:center;
  padding:1.35% 1.8%;
  border-radius:1.55cqw;
  background:var(--visual-surface,rgba(255,255,255,.06));
  border:1px solid var(--visual-border,rgba(255,255,255,.09));
}
.ranking-bar-bg{
  position:absolute;
  inset:0;
  pointer-events:none;
  opacity:.11;
}
.ranking-bar-bg i{
  display:block;height:100%;
  background:linear-gradient(90deg,var(--visual-accent,#6f9cff),transparent);
}
.ranking-rank-wrap,.ranking-avatar,.ranking-copy,.ranking-value{
  position:relative;z-index:1
}
.ranking-rank-wrap{display:grid;place-items:center}
.ranking-rank{
  width:4.25cqw;height:4.25cqw;border-radius:1.15cqw;
  display:grid;place-items:center;
  border:1px solid var(--visual-border,rgba(255,255,255,.12));
  font-size:2.25cqw;font-weight:1000;
  color:var(--visual-muted,#a8b3c7);
  background:color-mix(in srgb,var(--visual-bg,#10192b) 82%,white 18%);
}
.ranking-avatar{
  width:5.4cqw;height:5.4cqw;border-radius:50%;
  display:grid;place-items:center;
  font-size:1.7cqw;font-weight:1000;
  color:var(--visual-text,#fff);
  background:
    linear-gradient(145deg,color-mix(in srgb,var(--visual-accent) 70%,white 30%),color-mix(in srgb,var(--visual-accent) 52%,black 48%));
  border:.22cqw solid color-mix(in srgb,var(--visual-accent) 70%,white 30%);
  background-size:cover;background-position:center;
}
.ranking-avatar.has-image span{display:none}
.ranking-name{
  font-size:calc(3.05cqw * var(--body-scale,1));
  font-weight:950;
  line-height:1.04;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap
}
.ranking-meta{
  display:flex;align-items:center;gap:.7cqw;
  margin-top:.55cqw;
  font-size:calc(1.55cqw * var(--body-scale,1));
  color:var(--visual-muted,#a8b3c7);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis
}
.ranking-category,.ranking-note{
  overflow:hidden;text-overflow:ellipsis
}
.ranking-value{
  min-width:11cqw;
  text-align:right;
  line-height:1
}
.ranking-value .value{
  font-size:calc(3.65cqw * var(--body-scale,1));
  font-weight:1000
}
.ranking-unit{
  font-size:calc(1.35cqw * var(--body-scale,1));
  font-weight:900;
  color:var(--visual-muted,#a8b3c7);
  margin-left:.45cqw
}

/* Top 3 without emoji dependency */
.ranking-row.rank-top-1{
  border-color:color-mix(in srgb,#E9B94E 70%,var(--visual-border) 30%);
}
.ranking-row.rank-top-1 .ranking-rank{
  color:#241A06;background:#E9B94E;border-color:#F5D986
}
.ranking-row.rank-top-2 .ranking-rank{
  color:#1B232D;background:#C7D0DA;border-color:#E5EAF0
}
.ranking-row.rank-top-3 .ranking-rank{
  color:#24150D;background:#C98A5B;border-color:#E6B58F
}

/* Row count density */
.ranking-count-short .ranking-row{padding:2.1% 2.1%}
.ranking-count-short .ranking-name{font-size:calc(3.5cqw * var(--body-scale,1))}
.ranking-count-long .ranking-list{gap:.58%}
.ranking-count-long .ranking-row{padding:.72% 1.45%;border-radius:1.1cqw}
.ranking-count-long .ranking-avatar{width:4cqw;height:4cqw;font-size:1.3cqw}
.ranking-count-long .ranking-rank{width:3.3cqw;height:3.3cqw;font-size:1.75cqw}
.ranking-count-long .ranking-name{font-size:calc(2.2cqw * var(--body-scale,1))}
.ranking-count-long .ranking-meta{font-size:calc(1.15cqw * var(--body-scale,1));margin-top:.2cqw}
.ranking-count-long .ranking-value .value{font-size:calc(2.45cqw * var(--body-scale,1))}
.ranking-count-long .ranking-unit{font-size:1.05cqw}
.density-compact .ranking-list{gap:.55%}
.density-compact .ranking-row{padding:.82% 1.45%}

/* Template: Minimal */
.ranking-template-minimal{
  --ranking-radius:.7cqw;
}
.ranking-template-minimal .ranking-kicker{letter-spacing:.12em}
.ranking-template-minimal .ranking-row{
  border-radius:var(--ranking-radius);
  box-shadow:none;
}
.ranking-template-minimal .ranking-avatar{border-radius:1cqw}
.ranking-template-minimal .ranking-bar-bg{display:none!important}

/* Template: Sports */
.ranking-template-sports .ranking-title{text-transform:uppercase;font-style:italic}
.ranking-template-sports .ranking-row{
  border-left:.55cqw solid color-mix(in srgb,var(--visual-accent) 72%,transparent 28%);
}
.ranking-template-sports .ranking-count-badge{
  background:color-mix(in srgb,var(--visual-accent) 18%,transparent 82%);
  color:var(--visual-text)
}

/* Template: Dark */
.ranking-template-dark .ranking-row{
  background:color-mix(in srgb,var(--visual-bg) 78%,white 22%);
}
.ranking-template-dark .ranking-rule{
  background:var(--visual-border)
}
.ranking-template-dark .ranking-avatar{
  filter:saturate(.72)
}

/* Template: Newspaper */
.ranking-template-newspaper{
  letter-spacing:0;
}
.ranking-template-newspaper .ranking-kicker{
  color:var(--visual-text);
  border-bottom:.2cqw solid var(--visual-text);
  padding-bottom:1%;
}
.ranking-template-newspaper .ranking-title{
  font-family:Georgia,serif;
  letter-spacing:-.045em;
}
.ranking-template-newspaper .ranking-row{
  border-radius:0;
  border-width:0 0 1px 0;
  background:transparent;
}
.ranking-template-newspaper .ranking-avatar{
  border-radius:0;
  filter:grayscale(1)
}
.ranking-template-newspaper .ranking-count-badge{
  border-radius:0
}
.ranking-template-newspaper .ranking-rule{display:none}

/* Template: Neon */
.ranking-template-neon{
  background:
    radial-gradient(circle at 82% 5%,color-mix(in srgb,var(--visual-accent) 26%,transparent 74%),transparent 34%),
    var(--visual-bg);
}
.ranking-template-neon .ranking-kicker,
.ranking-template-neon .ranking-value .value{
  text-shadow:0 0 1.5cqw color-mix(in srgb,var(--visual-accent) 70%,transparent 30%);
}
.ranking-template-neon .ranking-row{
  box-shadow:inset 0 0 0 .1cqw color-mix(in srgb,var(--visual-accent) 16%,transparent 84%);
}
.ranking-template-neon .ranking-rank{
  box-shadow:0 0 1.2cqw color-mix(in srgb,var(--visual-accent) 26%,transparent 74%);
}

@media(max-width:760px){
  .template-picker{grid-template-columns:1fr 1fr}
}


/* ===== V2 R3 Shared Image Manager ===== */
.image-manager{
  border:1px solid #29415f;
  border-radius:10px;
  background:#0a1626;
  padding:8px;
  outline:none;
}
.image-manager:focus{
  border-color:#4a73aa;
}
.image-manager-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
  margin-bottom:7px;
}
.image-manager-label{
  font-size:9px;
  font-weight:950;
  color:#8fa4c1;
  letter-spacing:.06em;
}
.image-remove:disabled{opacity:.35;cursor:not-allowed}
.image-dropzone{
  display:flex;
  align-items:center;
  gap:10px;
  min-height:70px;
  padding:8px;
  border:1px dashed #385473;
  border-radius:9px;
  background:#0c192a;
  cursor:pointer;
  transition:.15s;
}
.image-dropzone.dragging{
  border-color:#6d9cff;
  background:#112542;
  transform:scale(1.01);
}
.image-preview{
  width:56px;
  height:56px;
  flex:none;
  overflow:hidden;
  display:grid;
  place-items:center;
  background:#172842;
  border:1px solid #395372;
}
.image-preview.circle{border-radius:50%}
.image-preview.square{border-radius:2px}
.image-preview.rounded{border-radius:12px}
.image-preview.original{border-radius:5px}
.image-preview img{
  width:100%;height:100%;object-fit:cover;display:block
}
.image-preview.original img{object-fit:contain}
.image-placeholder{
  font-size:19px;
  color:#6e86a8;
  font-weight:700;
}
.image-drop-copy{
  min-width:0;
  display:grid;
  gap:3px;
}
.image-drop-copy b{font-size:10px;color:#c8d5e7}
.image-drop-copy small{font-size:9px;color:#6f84a1}
.image-manager-actions{
  display:flex;
  gap:6px;
  margin-top:7px;
}
.image-manager-actions .btn{flex:1}
.image-shape-row{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:5px;
  margin-top:7px;
}
.image-shape-row button{
  min-height:28px;
  border:1px solid #28405e;
  border-radius:7px;
  background:#0e1c30;
  color:#7f94b1;
  font-size:8px;
  font-weight:850;
}
.image-shape-row button.active{
  background:#27538f;
  border-color:#4f7cba;
  color:#fff;
}
.image-manager-status{
  min-height:14px;
  margin-top:5px;
  font-size:8px;
  color:#7890ae;
}
.image-manager-status.ok{color:#67d79d}
.image-manager-status.error{color:#ff8c8c}
.image-manager-status.warn{color:#d8ba71}

/* Ranking avatar shape */
.ranking-avatar.shape-square{border-radius:2px}
.ranking-avatar.shape-rounded{border-radius:1.15cqw}
.ranking-avatar.shape-original{
  border-radius:.6cqw;
  background-size:contain;
  background-repeat:no-repeat;
  background-color:var(--visual-surface);
}

/* Stat Card image */
.stat-hero{
  display:grid;
  grid-template-columns:31% minmax(0,1fr);
  gap:5%;
  align-items:end;
}
.stat-image-wrap{
  aspect-ratio:4/5;
  overflow:hidden;
  display:grid;
  place-items:center;
  background:
    radial-gradient(circle at 50% 30%,color-mix(in srgb,var(--visual-accent) 22%,transparent 78%),transparent 48%),
    color-mix(in srgb,var(--visual-surface) 84%,white 16%);
  border:1px solid var(--visual-border);
}
.stat-image-wrap.shape-circle{aspect-ratio:1;border-radius:50%}
.stat-image-wrap.shape-square{aspect-ratio:1;border-radius:1%}
.stat-image-wrap.shape-rounded{border-radius:12%}
.stat-image-wrap.shape-original{border-radius:5%}
.stat-image{
  width:100%;height:100%;object-fit:cover;display:block
}
.stat-image-wrap.shape-original .stat-image{object-fit:contain}
.stat-image-placeholder{
  font-size:1.55cqw;
  font-weight:1000;
  color:var(--visual-muted);
  letter-spacing:.12em;
}
.stat-top{
  min-width:0;
  display:flex;
  justify-content:space-between;
  align-items:flex-end;
  gap:4%;
}
.stat-name{
  overflow:hidden;
  text-overflow:ellipsis;
}

/* Quadrant image markers */
.quad-point-dot.has-image{
  width:4.8cqw;
  height:4.8cqw;
  background-size:cover;
  background-position:center;
  border:.28cqw solid color-mix(in srgb,var(--visual-accent) 72%,white 28%);
  box-shadow:0 0 0 .7cqw color-mix(in srgb,var(--visual-accent) 15%,transparent 85%);
}
.quad-point-dot.has-image.shape-square{border-radius:2px}
.quad-point-dot.has-image.shape-rounded{border-radius:1.1cqw}
.quad-point-dot.has-image.shape-original{
  border-radius:.5cqw;
  background-size:contain;
  background-repeat:no-repeat;
  background-color:var(--visual-surface);
}

@media(max-width:760px){
  .image-dropzone{min-height:64px}
  .image-preview{width:50px;height:50px}
}

.player-card .stat-divider{margin:4% 0}
.player-card .stat-grid{margin-top:0}


/* ===== V2 R4 Paste / CSV Import ===== */
.data-import{
  display:grid;
  gap:8px;
}
.data-import-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
}
.data-import-title{
  font-size:10px;
  font-weight:950;
  color:#cfdaea;
}
.data-import-sub{
  margin-top:2px;
  font-size:8px;
  color:#6f85a3;
}
.import-text{
  min-height:112px;
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  font-size:9px;
  line-height:1.5;
  white-space:pre;
  overflow:auto;
}
.data-import-actions{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:6px;
}
.import-preview{
  border:1px solid #29415f;
  border-radius:10px;
  background:#0b1727;
  padding:8px;
}
.import-preview-head{
  display:flex;
  justify-content:space-between;
  gap:8px;
  margin-bottom:7px;
  font-size:8px;
  color:#7f95b2;
  font-weight:900;
}
.import-preview-table{
  display:grid;
  gap:4px;
}
.import-preview-row{
  display:grid;
  grid-template-columns:22px minmax(0,1fr) auto;
  gap:7px;
  align-items:center;
  min-height:28px;
  border:1px solid #223854;
  border-radius:7px;
  padding:4px 7px;
  background:#0e1b2e;
  font-size:9px;
}
.import-preview-row b{
  color:#6f8db6;
}
.import-preview-row .main{
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
  color:#d4e0ef;
}
.import-preview-row .value{
  color:#92b4e6;
  font-weight:950;
}
.import-preview-more{
  padding:5px 7px;
  color:#667e9e;
  font-size:8px;
  text-align:center;
}
.import-mode{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:5px;
  margin-top:8px;
}
.import-mode button{
  min-height:30px;
  border:1px solid #29405d;
  border-radius:7px;
  background:#0d192a;
  color:#8196b3;
  font-size:9px;
  font-weight:900;
}
.import-mode button.active{
  background:#27538f;
  border-color:#4e7bbd;
  color:#fff;
}
.import-apply{
  width:100%;
  margin-top:7px;
}
.import-status{
  min-height:14px;
  font-size:8px;
  color:#7189a8;
}
.import-status.ok{color:#67d79d}
.import-status.error{color:#ff8c8c}
.import-status.warn{color:#d8ba71}


/* ===== V2 R5 Bar Chart ===== */
.bar-visual{
  display:flex;
  flex-direction:column;
  padding:5.5%;
}
.bar-kicker{
  font-size:1.55cqw;
  font-weight:950;
  letter-spacing:.2em;
  color:var(--visual-accent);
  margin-bottom:1.3%;
}
.bar-head{
  display:flex;
  justify-content:space-between;
  align-items:flex-end;
  gap:4%;
}
.bar-title{
  font-size:calc(6.3cqw * var(--title-scale,1));
  line-height:1;
}
.bar-subtitle{
  font-size:calc(1.95cqw * var(--body-scale,1));
  margin-top:1.1%;
  text-transform:uppercase;
  letter-spacing:.08em;
}
.bar-max{
  border:1px solid var(--visual-border);
  border-radius:999px;
  padding:.65cqw 1.1cqw;
  font-size:1.35cqw;
  font-weight:900;
  color:var(--visual-muted);
}
.bar-rule{
  height:.22cqw;
  background:linear-gradient(90deg,var(--visual-accent),transparent);
  margin:2.4% 0 2.2%;
}
.bar-list{
  display:grid;
  gap:1.55%;
  flex:1;
  align-content:stretch;
}
.bar-row{
  display:grid;
  align-content:center;
  min-height:0;
}
.bar-row-top{
  display:flex;
  justify-content:space-between;
  align-items:flex-end;
  gap:3%;
  margin-bottom:.55cqw;
}
.bar-label-wrap{
  display:flex;
  align-items:center;
  gap:1.25cqw;
  min-width:0;
}
.bar-index{
  font-size:1.35cqw;
  font-weight:950;
  color:var(--visual-accent);
  opacity:.9;
}
.bar-name{
  font-size:calc(2.7cqw * var(--body-scale,1));
  line-height:1;
  font-weight:950;
  overflow:hidden;
  white-space:nowrap;
  text-overflow:ellipsis;
}
.bar-category{
  margin-top:.38cqw;
  font-size:calc(1.25cqw * var(--body-scale,1));
  color:var(--visual-muted);
}
.bar-value-wrap{
  flex:none;
  text-align:right;
  font-weight:1000;
}
.bar-value{
  font-size:calc(2.8cqw * var(--body-scale,1));
}
.bar-unit{
  margin-left:.35cqw;
  font-size:1.2cqw;
  color:var(--visual-muted);
}
.bar-track{
  height:1.75cqw;
  border-radius:999px;
  background:color-mix(in srgb,var(--visual-surface) 84%,white 16%);
  overflow:hidden;
  position:relative;
}
.bar-fill{
  height:100%;
  border-radius:999px;
  background:linear-gradient(90deg,var(--visual-accent),color-mix(in srgb,var(--visual-accent) 64%,white 36%));
  position:relative;
  z-index:2;
  box-shadow:0 0 2.3cqw color-mix(in srgb,var(--visual-accent) 18%,transparent 82%);
}
.bar-grid-lines{
  position:absolute;
  inset:0;
  z-index:1;
  opacity:.35;
  background:repeating-linear-gradient(
    90deg,
    transparent 0,
    transparent calc(20% - .12cqw),
    var(--visual-border) calc(20% - .12cqw),
    var(--visual-border) 20%
  );
}
.bar-dense .bar-list{gap:.8%}
.bar-dense .bar-name{font-size:2.05cqw}
.bar-dense .bar-track{height:1.15cqw}
.bar-dense .bar-category{font-size:1cqw}
.bar-dense .bar-value{font-size:2.1cqw}

/* ===== V2 R5 Radar Chart ===== */
.radar-visual{
  display:flex;
  flex-direction:column;
  padding:4.8% 5.5% 4.5%;
}
.radar-kicker{
  font-size:1.5cqw;
  font-weight:950;
  letter-spacing:.2em;
  color:var(--visual-accent);

.sb-label{font-size:1.5cqw;color:var(--visual-muted);font-weight:900;text-transform:uppercase;letter-spacing:.08em}.sb-number{font-size:6cqw;font-weight:1000;margin-top:.4cqw}
.sb-ring{position:relative;width:11cqw;height:11cqw;margin:1cqw auto 0}.sb-ring svg{width:100%;height:100%;transform:rotate(-90deg)}.sb-ring circle{fill:none;stroke-width:9;stroke-linecap:round}.sb-ring .bg{stroke:var(--visual-border)}.sb-ring .fg{stroke:var(--visual-accent)}.sb-ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:2.5cqw}
.sb-progress-head{display:flex;align-items:baseline;gap:.4cqw;margin-top:1cqw}.sb-progress-head b{font-size:4.5cqw}.sb-progress-head span{font-size:1.4cqw;color:var(--visual-muted)}.sb-progress{height:1.2cqw;border-radius:999px;background:var(--visual-border);overflow:hidden}.sb-progress i{display:block;height:100%;background:var(--visual-accent);border-radius:inherit}
.sb-text-title{font-size:2.2cqw;font-weight:1000}.sb-text{font-size:1.6cqw;color:var(--visual-muted);line-height:1.5;margin-top:.7cqw}
.statboard-add-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:6px;margin-top:8px}

@media(max-width:760px){
  #moreBtn{min-width:40px;width:40px;padding:0}
  .more-menu{top:50px;right:6px;width:180px}
  .tier-manual-row{grid-template-columns:1fr 120px}
}

:\"Player E\",value:55,tier:\"D\"}\n    ]\n  };\n  p.settings={mode:\"auto\",showScore:true};\n  return p;\n}\n\nexport function createHeatmapProject(){\n  const p=base(\"heatmap\",\"Team Attribute Heatmap\");\n  p.meta.subtitle=\"PLAYER × ATTRIBUTE\";\n  p.data={\n    columns:[\n      {id:uid(\"column\"),label:\"PAC\"},\n      {id:uid(\"column\"),label:\"SHO\"},\n      {id:uid(\"column\"),label:\"PAS\"},\n      {id:uid(\"column\"),label:\"DEF\"}\n    ],\n    rows:[\n      {id:uid(\"row\"),name:\"Player A\",values:[92,87,80,42]},\n      {id:uid(\"row\"),name:\"Player B\",values:[83,91,86,50]},\n      {id:uid(\"row\"),name:\"Player C\",values:[77,75,94,68]},\n      {id:uid(\"row\"),name:\"Player D\",values:[69,82,72,90]}\n    ]\n  };\n  p.settings={min:0,max:100,showValues:true,decimals:0};\n  return p;\n}\n\nexport function createScatterProject(){\n  const p=base(\"scatter\",\"Value vs Performance\");\n  p.meta.subtitle=\"PRICE × SCORE\";\n  p.data.items=[\n    {id:uid(\"item\"),name:\"A\",x:24,y:88,category:\"Alpha\"},\n    {id:uid(\"item\"),name:\"B\",x:42,y:92,category:\"Beta\"},\n    {id:uid(\"item\"),name:\"C\",x:35,y:73,category:\"Alpha\"},\n    {id:uid(\"item\"),name:\"D\",x:68,y:95,category:\"Gamma\"},\n    {id:uid(\"item\"),name:\"E\",x:55,y:80,category:\"Beta\"}\n  ];\n  p.settings={\n    xAxis:{label:\"Price\",min:0,max:80},\n    yAxis:{label:\"Score\",min:60,max:100},\n    showAverage:true,\n    showTrend:true,\n    showLabels:true\n  };\n  return p;\n}\n\nexport function createRangeProject(){\n  const p=base(\"range\",\"Before / After\");\n  p.meta.subtitle=\"CHANGE COMPARISON\";\n  p.data.items=[\n    {id:uid(\"item\"),name:\"Player A\",value:72,value2:91},\n    {id:uid(\"item\"),name:\"Player B\",value:84,value2:88},\n    {id:uid(\"item\"),name:\"Player C\",value:78,value2:69},\n    {id:uid(\"item\"),name:\"Player D\",value:65,value2:82}\n  ];\n  p.settings={labelA:\"2025\",labelB:\"2026\",unit:\"\",autoRange:true,min:0,max:100,showDiff:true};\n  return p;\n}\n\nexport function createWaffleProject(){\n  const p=base(\"waffle\",\"Outcome Share\");\n  p.meta.subtitle=\"100-CELL BREAKDOWN\";\n  p.data.categories=[\n    {id:uid(\"item\"),label:\"Win\",value:55},\n    {id:uid(\"item\"),label:\"Draw\",value:20},\n    {id:uid(\"item\"),label:\"Loss\",value:25}\n  ];\n  p.settings={cells:100,columns:10,unit:\"%\",showLegend:true};\n  return p;\n}\n\n\nexport function createStatBoardProject(){\n  const p=base(\"stat-board\",\"PLAYER A — STAT BOARD\");\n  p.meta.subtitle=\"2026 PERFORMANCE OVERVIEW\";\n  p.canvas={preset:\"portrait\",width:1080,height:1350,transparent:false};\n  p.data={\n    blocks:[\n      {id:uid(\"block\"),type:\"hero\",span:2,title:\"PLAYER A\",subtitle:\"FORWARD / CLUB X\",value:\"96\"},\n      {id:uid(\"block\"),type:\"number\",span:1,label:\"Goals\",value:\"32\"},\n      {id:uid(\"block\"),type:\"number\",span:1,label:\"Assists\",value:\"18\"},\n      {id:uid(\"block\"),type:\"ring\",span:1,label:\"Win Rate\",value:72,max:100},\n      {id:uid(\"block\"),type:\"progress\",span:1,label:\"Form\",value:88,max:100},\n      {id:uid(\"block\"),type:\"text\",span:2,title:\"Season Note\",text:\"Elite production with strong all-round contribution.\"}\n    ]\n  };\n  p.settings={columns:2,gap:\"medium\"};\n  return p;\n}\n\nexport function createProject(type){\n  if(type===\"ranking-card\")return createRankingProject();\n  if(type===\"stat-card\")return createStatCardProject();\n  if(type===\"quadrant\")return createQuadrantProject();\n  if(type===\"bar\")return createBarProject();\n  if(type===\"radar\")return createRadarProject();\n  if(type===\"dot\")return createDotProject();\n  if(type===\"ring\")return createRingProject();\n  if(type===\"tier-list\")return createTierProject();\n  if(type===\"heatmap\")return createHeatmapProject();\n  if(type===\"scatter\")return createScatterProject();\n  if(type===\"range\")return createRangeProject();\n  if(type===\"waffle\")return createWaffleProject();\n  if(type===\"stat-board\")return createStatBoardProject();\n  throw new Error(`Unknown visualization: ${type}`);\n}\n\nexport function applyTheme(project,themeId){\n  const th=THEMES[themeId]||THEMES.dark;\n  project.style.theme=th.id;\n  project.style.background=th.bg;\n  project.style.surface=th.surface;\n  project.style.primary=th.text;\n  project.style.secondary=th.muted;\n  project.style.accent=th.accent;\n  project.style.border=th.border;\n}\n\nexport function applyCanvasPreset(project,presetId){\n  const p=CANVAS_PRESETS[presetId];\n  if(!p)return;\n  project.canvas.preset=presetId;\n  project.canvas.width=p.width;\n  project.canvas.height=p.height;\n}\n\nexport function cloneProject(project){\n  const c=structuredClone(project);\n  c.id=uid(\"project\");\n  c.meta.title=`${project.meta.title} Copy`;\n  c.meta.createdAt=new Date().toISOString();\n  c.meta.updatedAt=c.meta.createdAt;\n  c.publish={cloudId:null,visibility:\"private\",publishedAt:null};\n  return c;\n}\n\nexport function newItemId(){return uid(\"item\")}\nexport function newStatId(){return uid(\"stat\")}\nexport function newAxisId(){return uid(\"axis\")}\nexport function newSeriesId(){return uid(\"series\")}\n", "core/store.js": "const PROJECT_KEY=\"statsMakerV2Projects\";\nconst PREF_KEY=\"statsMakerV2Preferences\";\n\nfunction parseProjects(){\n  try{\n    const raw=localStorage.getItem(PROJECT_KEY);\n    const list=raw?JSON.parse(raw):[];\n    return Array.isArray(list)?list:[];\n  }catch{return []}\n}\n\nexport function listProjects(){\n  return parseProjects().sort((a,b)=>(b.meta?.updatedAt||\"\").localeCompare(a.meta?.updatedAt||\"\"));\n}\n\nexport function getProject(id){\n  return parseProjects().find(p=>p.id===id)||null;\n}\n\nexport function saveProject(project){\n  const list=parseProjects();\n  const idx=list.findIndex(p=>p.id===project.id);\n  const copy=structuredClone(project);\n  copy.meta.updatedAt=new Date().toISOString();\n  if(idx>=0)list[idx]=copy;\n  else list.push(copy);\n  localStorage.setItem(PROJECT_KEY,JSON.stringify(list));\n  return copy;\n}\n\nexport function deleteProject(id){\n  localStorage.setItem(PROJECT_KEY,JSON.stringify(parseProjects().filter(p=>p.id!==id)));\n}\n\nexport function getPreferences(){\n  try{return JSON.parse(localStorage.getItem(PREF_KEY)||\"{}\")}catch{return {}}\n}\nexport function savePreferences(prefs){\n  localStorage.setItem(PREF_KEY,JSON.stringify(prefs||{}));\n}\n", "editor/data-import.js": "\nimport {\n  parseTableText,\n  mapRankingRows,\n  mapQuadrantRows,\n  mapStatRows,\n  mapRadarMatrix,\n  mapRangeRows,\n  mapRingRows,\n  mapWaffleRows,\n  mapHeatmapMatrix,\n  previewRows\n} from \"../core/import.js\";\n\nfunction chooseCsvFile(){\n  return new Promise(resolve=>{\n    const input=document.createElement(\"input\");\n    input.type=\"file\";\n    input.accept=\".csv,.tsv,text/csv,text/tab-separated-values,text/plain\";\n    input.onchange=()=>resolve(input.files?.[0]||null);\n    input.click();\n  });\n}\n\nfunction mapperFor(kind){\n  if([\"ranking\",\"bar\",\"dot\",\"tier\"].includes(kind))return mapRankingRows;\n  if([\"quadrant\",\"scatter\"].includes(kind))return mapQuadrantRows;\n  if(kind===\"radar\")return mapRadarMatrix;\n  if(kind===\"range\")return mapRangeRows;\n  if(kind===\"ring\")return mapRingRows;\n  if(kind===\"waffle\")return mapWaffleRows;\n  if(kind===\"heatmap\")return mapHeatmapMatrix;\n  return mapStatRows;\n}\n\nfunction exampleFor(kind){\n  if(kind===\"ranking\"){\n    return `Name\\tValue\\tCategory\\tNote\nPlayer A\\t92\\tClub Alpha\\tElite finisher\nPlayer B\\t86\\tClub Beta\\tBreakout season\nPlayer C\\t80\\tClub Gamma\\tComplete creator`;\n  }\n\n  if(kind===\"quadrant\"){\n    return `Name\\tX\\tY\\tCategory\nPlayer A\\t82\\t88\\tClub Alpha\nPlayer B\\t34\\t76\\tClub Beta\nPlayer C\\t75\\t32\\tClub Gamma`;\n  }\n\n  return `Label\\tValue\nPAC\\t92\nSHO\\t91\nPAS\\t88\nDRI\\t95`;\n}\n\nexport function createDataImport({\n  kind,\n  onImport\n}){\n  const wrap=document.createElement(\"div\");\n  wrap.className=\"data-import\";\n\n  wrap.innerHTML=`\n    <div class=\"data-import-head\">\n      <div>\n        <div class=\"data-import-title\">Paste / CSV</div>\n        <div class=\"data-import-sub\">Excel / Google Sheets compatible</div>\n      </div>\n      <button type=\"button\" class=\"btn compact import-example\">Example</button>\n    </div>\n\n    <textarea class=\"textarea import-text\" spellcheck=\"false\"></textarea>\n\n    <div class=\"data-import-actions\">\n      <button type=\"button\" class=\"btn import-csv\">CSV / TSV</button>\n      <button type=\"button\" class=\"btn import-preview-btn\">Preview</button>\n    </div>\n\n    <div class=\"import-preview hidden\">\n      <div class=\"import-preview-head\">\n        <span class=\"import-count\"></span>\n        <span class=\"import-delimiter\"></span>\n      </div>\n      <div class=\"import-preview-table\"></div>\n\n      <div class=\"import-mode\">\n        <button type=\"button\" data-mode=\"replace\" class=\"active\">Replace</button>\n        <button type=\"button\" data-mode=\"append\">Append</button>\n      </div>\n\n      <button type=\"button\" class=\"btn primary import-apply\">Import</button>\n    </div>\n\n    <div class=\"import-status\"></div>\n  `;\n\n  const ta=wrap.querySelector(\".import-text\");\n  const previewBox=wrap.querySelector(\".import-preview\");\n  const previewTable=wrap.querySelector(\".import-preview-table\");\n  const count=wrap.querySelector(\".import-count\");\n  const delim=wrap.querySelector(\".import-delimiter\");\n  const status=wrap.querySelector(\".import-status\");\n\n  let currentMapped=[];\n  let mode=\"replace\";\n\n  ta.placeholder=exampleFor(kind);\n\n  function setStatus(text,type=\"\"){\n    status.textContent=text||\"\";\n    status.className=`import-status ${type}`;\n  }\n\n  function renderPreview(){\n    const parsed=parseTableText(ta.value);\n    currentMapped=mapperFor(kind)(parsed.rows);\n\n    const importCount=kind===\"radar\"\n      ? (currentMapped.axes?.length||0)\n      : kind===\"heatmap\"\n        ? (currentMapped.rows?.length||0)\n        : currentMapped.length;\n\n    if(!importCount){\n      previewBox.classList.add(\"hidden\");\n      setStatus(\"No importable rows\",\"warn\");\n      return;\n    }\n\n    previewBox.classList.remove(\"hidden\");\n    count.textContent=kind===\"radar\"\n      ? `${currentMapped.axes.length} axes / ${currentMapped.series.length} series`\n      : kind===\"heatmap\"\n        ? `${currentMapped.rows.length} rows / ${currentMapped.columns.length} columns`\n        : `${currentMapped.length} rows`;\n    delim.textContent=parsed.delimiter===\"\\t\"?\"TSV\":parsed.delimiter===\";\"?\"CSV ;\":\"CSV\";\n\n    previewTable.innerHTML=\"\";\n\n    if(kind===\"radar\"){\n      currentMapped.axes.slice(0,6).forEach((axis,index)=>{\n        const line=document.createElement(\"div\");\n        line.className=\"import-preview-row\";\n        line.innerHTML=`\n          <b>${index+1}</b>\n          <span class=\"main\"></span>\n          <span class=\"value\"></span>\n        `;\n        line.querySelector(\".main\").textContent=axis.label;\n        line.querySelector(\".value\").textContent=currentMapped.series\n          .map(s=>s.values[index])\n          .join(\" / \");\n        previewTable.appendChild(line);\n      });\n\n      if(currentMapped.axes.length>6){\n        const more=document.createElement(\"div\");\n        more.className=\"import-preview-more\";\n        more.textContent=`+ ${currentMapped.axes.length-6} more`;\n        previewTable.appendChild(more);\n      }\n      setStatus(\"\");\n      return;\n    }\n\n    if(kind===\"heatmap\"){\n      currentMapped.rows.slice(0,6).forEach((row,index)=>{\n        const line=document.createElement(\"div\");\n        line.className=\"import-preview-row\";\n        line.innerHTML=`<b>${index+1}</b><span class=\"main\"></span><span class=\"value\"></span>`;\n        line.querySelector(\".main\").textContent=row.name;\n        line.querySelector(\".value\").textContent=row.values.slice(0,3).join(\" / \");\n        previewTable.appendChild(line);\n      });\n      setStatus(\"\");\n      return;\n    }\n\n    const preview=previewRows(currentMapped,6);\n\n    preview.forEach((row,index)=>{\n      const line=document.createElement(\"div\");\n      line.className=\"import-preview-row\";\n\n      if(kind===\"ranking\"){\n        line.innerHTML=`\n          <b>${index+1}</b>\n          <span class=\"main\"></span>\n          <span class=\"value\"></span>\n        `;\n        line.querySelector(\".main\").textContent=row.name;\n        line.querySelector(\".value\").textContent=row.value;\n      }else if(kind===\"quadrant\"){\n        line.innerHTML=`\n          <b>${index+1}</b>\n          <span class=\"main\"></span>\n          <span class=\"value\"></span>\n        `;\n        line.querySelector(\".main\").textContent=row.name;\n        line.querySelector(\".value\").textContent=`${row.x}, ${row.y}`;\n      }else{\n        line.innerHTML=`\n          <b>${index+1}</b>\n          <span class=\"main\"></span>\n          <span class=\"value\"></span>\n        `;\n        line.querySelector(\".main\").textContent=row.label;\n        line.querySelector(\".value\").textContent=row.value;\n      }\n\n      previewTable.appendChild(line);\n    });\n\n    if(currentMapped.length>preview.length){\n      const more=document.createElement(\"div\");\n      more.className=\"import-preview-more\";\n      more.textContent=`+ ${currentMapped.length-preview.length} more`;\n      previewTable.appendChild(more);\n    }\n\n    setStatus(\"\");\n  }\n\n  wrap.querySelector(\".import-example\").addEventListener(\"click\",()=>{\n    ta.value=exampleFor(kind);\n    renderPreview();\n  });\n\n  wrap.querySelector(\".import-preview-btn\").addEventListener(\"click\",renderPreview);\n\n  wrap.querySelector(\".import-csv\").addEventListener(\"click\",async()=>{\n    const file=await choose const HOME_CLASS = "";
const EDITOR_CLASS = "editor-body";

const moduleUrlCache = new Map();

function normalizeModulePath(base, spec) {
  const parts = base.split("/");
  parts.pop();
  for (const part of spec.split("/")) {
    if (!part || part === ".") continue;
    if (part === "..") parts.pop();
    else parts.push(part);
  }
  return parts.join("/");
}

async function makeModuleUrl(path) {
  if (moduleUrlCache.has(path)) return moduleUrlCache.get(path);

  let source = MODULE_SOURCES[path];
  if (source == null) throw new Error("Embedded module not found: " + path);

  const importPattern = /(?:from\s+|import\s*\(\s*)["']([^"']+)["']/g;
  const specs = [...source.matchAll(importPattern)]
    .map(m => m[1])
    .filter(spec => spec.startsWith("."));

  for (const spec of [...new Set(specs)]) {
    const depPath = normalizeModulePath(path, spec);
    const depUrl = await makeModuleUrl(depPath);
    const escaped = spec.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
    source = source.replace(
      new RegExp('(["\\\'])' + escaped + '\\1', "g"),
      JSON.stringify(depUrl)
    );
  }

  const url = URL.createObjectURL(new Blob([source], {type:"text/javascript"}));
  moduleUrlCache.set(path, url);
  return url;
}

async function boot() {
  const params = new URLSearchParams(location.search);
  const editorMode = params.get("view") === "editor";

  document.body.className = editorMode ? EDITOR_CLASS : HOME_CLASS;
  document.body.innerHTML = editorMode ? EDITOR_BODY : HOME_BODY;
  document.title = editorMode ? "Stats Maker V2 — Preview Editor" : "Stats Maker V2 — Single Preview";

  const entry = editorMode ? "editor/editor.js" : "home.js";
  const entryUrl = await makeModuleUrl(entry);
  await import(entryUrl);
}
